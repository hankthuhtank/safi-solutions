<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#071226">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self'; frame-src blob:; font-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>Private field guide</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 60'%3E%3Cpath fill='%2389dadd' d='M20 0 39 20 32 48 20 60 8 48 1 20Z'/%3E%3C/svg%3E">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { color: #e3edf7; background: #071226; font: 16px/1.6 system-ui, sans-serif; }
    .gate { min-height: 100%; display: grid; place-items: center; padding: 25px; background: radial-gradient(ellipse at 50% 30%, #214b794d, transparent 60%), linear-gradient(135deg, #050b18, #0d2340); }
    .panel { width: min(100%, 470px); padding: 42px; border: 1px solid #7595af55; background: linear-gradient(140deg,#142b4ded,#0b172aee); box-shadow: 0 30px 100px #0006, inset 0 0 40px #4487b510; border-radius: 12px; }
    .crystal { width: 32px; height: 58px; margin-bottom: 30px; background: linear-gradient(110deg,#e3ffff,#77cbdf 40%,#2b718b 41%,#b3e7e1 75%,#c1e6f3 76%); clip-path: polygon(50% 0,100% 32%,80% 80%,50% 100%,20% 80%,0 32%); animation: float 5s ease-in-out infinite; }
    .eyebrow { color: #ccb285; font: 10px ui-monospace, monospace; letter-spacing: .2em; }
    h1 { font: 36px/1.2 Georgia, serif; font-weight: 400; margin: 12px 0 15px; }
    p { color: #a7bbcf; font-size: 14px; margin-bottom: 25px; }
    label { display: block; font-size: 12px; color: #b9cbd9; margin-bottom: 8px; }
    input { display: block; width: 100%; padding: 13px; border: 1px solid #45617a; border-radius: 5px; background: #060e1c; color: #eaf7ff; font: 15px ui-monospace, monospace; }
    button { margin-top: 15px; padding: 13px; width: 100%; border: 1px solid #9de0e0; border-radius: 5px; background: linear-gradient(100deg,#a1e0e0,#77becf); color: #102235; cursor: pointer; font: 600 14px system-ui, sans-serif; }
    button:disabled { opacity: .5; cursor: wait; }
    input:focus-visible, button:focus-visible { outline: 2px solid #d5b97f; outline-offset: 4px; }
    #status { min-height: 25px; font-size: 12px; color: #eab5ab; margin: 13px 0 0; }
    .foot { font-size: 11px; border-top: 1px solid #7794ad33; padding-top: 18px; margin: 20px 0 0; }
    iframe { border: 0; position: fixed; inset: 0; width: 100%; height: 100%; background: #071226; }
    @keyframes float { 50% { transform: translateY(-8px); filter: brightness(1.2); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    @media (max-width: 520px) { .panel { padding: 30px 25px; } }
  </style>
</head>
<body>
  <main class="gate" id="gate">
    <section class="panel" aria-labelledby="title">
      <div class="crystal" aria-hidden="true"></div>
      <div class="eyebrow">A PRIVATE COLLECTION</div>
      <h1 id="title">Your field guide.</h1>
      <p>Enter your private key to open the guide on this device.</p>
      <form id="unlock-form">
        <label for="key">Unlock key</label>
        <input id="key" type="password" autocomplete="current-password" required spellcheck="false" autocapitalize="none">
        <button id="unlock" type="submit">Open guide →</button>
        <div id="status" role="status" aria-live="polite"></div>
      </form>
      <p class="foot">The guide is encrypted. Your key is never sent to a server. Keep it private; anyone with the key can open it.</p>
    </section>
  </main>
  <script src="unlock.js"></script>
</body>
</html>
