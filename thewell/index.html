<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>THE WELL</title>
    <meta name="theme-color" content="#101311" />
    <meta name="description" content="A visual guide to cocktails, zero-proof drinks, ingredients and the craft of bartending." />
    <meta property="og:title" content="THE WELL" />
    <meta property="og:description" content="A visual guide to cocktails, zero-proof drinks, ingredients and the craft of bartending." />
    <link rel="icon" type="image/svg+xml" href="/thewell/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@320;400;500;600&display=swap" rel="stylesheet" />
    <style>
      /* Keep the app's brand slot for layout, but render Safi's logo independently. */
      #root header > a:first-child,
      #root aside > div:first-child > a:first-child {
        visibility: hidden !important;
      }

      .thewell-brand-fixed {
        position: fixed;
        z-index: 2147483647;
        left: 16px;
        top: 10px;
        display: block;
        width: 140px;
        height: 48px;
        overflow: hidden;
        text-decoration: none;
      }

      .thewell-brand-fixed img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: left center;
        opacity: 1 !important;
        visibility: visible !important;
      }

      @media (min-width: 1024px) {
        .thewell-brand-fixed {
          left: 16px;
          top: 22px;
          width: 150px;
          height: 52px;
        }
      }
    </style>
    <script>
      (function () {
        try {
          var key = "thewell:path";
          var saved = sessionStorage.getItem(key);
          if (!saved) return;
          sessionStorage.removeItem(key);
          if (saved.indexOf("/thewell") === 0) history.replaceState(null, "", saved);
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="https://cdn.jsdelivr.net/gh/hankthuhtank/the-well@efd370f489cc21da91c0fa1e921b9346bd32fc85/dist-portfolio/assets/portfolio-C3IRxaT5.js"></script>
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/hankthuhtank/the-well@efd370f489cc21da91c0fa1e921b9346bd32fc85/dist-portfolio/assets/portfolio-Dp_4NQah.css" />
  </head>
  <body>
    <a class="thewell-brand-fixed" href="/thewell/" aria-label="The Well home">
      <img src="/assets/project-logos/thewell.webp?v=11" alt="The Well" onerror="this.onerror=null;this.src='/assets/project-logos/thewell.jpg?v=11'" />
    </a>
    <div id="root"></div>
    <script>
      /*
       * Cocktail-family artwork lives locally so this section is not dependent
       * on third-party image URLs inside the pinned portfolio bundle.
       *
       * The eight image slots are packed into one WebP sprite and mapped to:
       * Old Fashioned, Martini, Negroni, Tiki, Highball,
       * Spritz, Sour, and Fizz / Collins.
       */
      (function () {
        var sprite = "/thewell/images/cocktail-families/families.webp?v=1";
        var fallback = "/thewell/images/bar-interior.jpg?v=2";
        var transparent = "data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=";
        var tiles = [
          { keys: ["old fashioned"], index: 0 },
          { keys: ["martini"], index: 1 },
          { keys: ["negroni"], index: 2 },
          { keys: ["tiki"], index: 3 },
          { keys: ["whiskey highball", "highball"], index: 4 },
          { keys: ["spritz"], index: 5 },
          { keys: ["sour"], index: 6 },
          { keys: ["collins", "fizz"], index: 7 }
        ];

        function tileFor(alt) {
          var key = (alt || "").toLowerCase();
          for (var i = 0; i < tiles.length; i += 1) {
            for (var j = 0; j < tiles[i].keys.length; j += 1) {
              if (key.indexOf(tiles[i].keys[j]) !== -1) return tiles[i];
            }
          }
          return null;
        }

        function sizeImage(img) {
          img.style.width = "100%";
          img.style.height = "100%";
          img.style.display = "block";
          img.style.objectFit = "cover";
        }

        function useSprite(img, tile) {
          if (!img || !tile) return;
          img.dataset.thewellFamilyLocal = "1";
          img.src = transparent;
          sizeImage(img);
          img.style.backgroundImage = 'url("' + sprite + '")';
          img.style.backgroundRepeat = "no-repeat";
          img.style.backgroundSize = "800% 100%";
          img.style.backgroundPosition = (tile.index * (100 / 7)) + "% 50%";
        }

        function useFallback(img) {
          if (!img || img.dataset.thewellFamilyFallback === "1") return;
          img.dataset.thewellFamilyFallback = "1";
          img.style.backgroundImage = "none";
          img.src = fallback;
          sizeImage(img);
          img.style.objectPosition = "50% 50%";
        }

        function watchImage(img) {
          if (!img || img.dataset.thewellFamilyWatched === "1") return;
          var alt = (img.alt || "").toLowerCase();
          if (alt.indexOf("cocktail family example") === -1) return;

          img.dataset.thewellFamilyWatched = "1";
          var tile = tileFor(alt);
          if (tile) {
            useSprite(img, tile);
            return;
          }

          img.addEventListener("error", function () { useFallback(img); });
          if (img.complete && img.naturalWidth === 0) {
            useFallback(img);
          } else {
            setTimeout(function () {
              if (img.complete && img.naturalWidth === 0) useFallback(img);
            }, 250);
          }
        }

        function scan(root) {
          if (!root) return;
          if (root.tagName === "IMG") watchImage(root);
          if (root.querySelectorAll) root.querySelectorAll("img").forEach(watchImage);
        }

        function start() {
          scan(document);
          new MutationObserver(function (mutations) {
            mutations.forEach(function (m) { m.addedNodes.forEach(scan); });
          }).observe(document.body, { childList: true, subtree: true });
        }

        if (document.body) start();
        else document.addEventListener("DOMContentLoaded", start, { once: true });
      })();
    </script>
  </body>
</html>
