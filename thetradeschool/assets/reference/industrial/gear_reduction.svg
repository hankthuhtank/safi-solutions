<text x="260" y="348" fill="#E9E5DC" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="11" font-weight="500" text-anchor="middle" letter-spacing="0.06em">PINION  12 T</text>
<text x="430" y="400" fill="#E9E5DC" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="11" font-weight="500" text-anchor="middle" letter-spacing="0.06em">GEAR  24 T</text>
<rect x="620" y="150" width="340" height="196" rx="12" fill="#1A1F26" stroke="#2E3540"/>
<text x="644" y="180" fill="#E4712F" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="13" font-weight="600" text-anchor="start" letter-spacing="0.06em">24 ÷ 12 = 2:1 REDUCTION</text>
<text x="644" y="212" fill="#E9E5DC" font-family="'Saira','Saira Condensed',system-ui,sans-serif" font-size="13" text-anchor="start">Output speed = input speed ÷ 2</text>
<text x="644" y="236" fill="#E9E5DC" font-family="'Saira','Saira Condensed',system-ui,sans-serif" font-size="13" text-anchor="start">Output torque ≈ input torque × 2</text>
<text x="644" y="268" fill="#97A1AD" font-family="'Saira','Saira Condensed',system-ui,sans-serif" font-size="13" text-anchor="start">The gearbox never adds power.</text>
<text x="644" y="290" fill="#97A1AD" font-family="'Saira','Saira Condensed',system-ui,sans-serif" font-size="12" text-anchor="start">Heat, noise and metal in the oil are</text>
<text x="644" y="308" fill="#97A1AD" font-family="'Saira','Saira Condensed',system-ui,sans-serif" font-size="12" text-anchor="start">the evidence that it is losing some.</text>
<line x1="36" y1="392" x2="964" y2="392" stroke="#2E3540"/>
<text x="36" y="422" fill="#E9E5DC" font-family="'Saira','Saira Condensed',system-ui,sans-serif" font-size="14" text-anchor="start">A gearbox that suddenly runs hot at the same load has lost lubrication, alignment or clearance, not ratio.</text>
</svg>
