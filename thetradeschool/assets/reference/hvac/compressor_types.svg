<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="What the compressor actually does">
<rect width="1000" height="560" fill="#12151A"/>
<rect x="0" y="0" width="1000" height="4" fill="#E0607E"/>
<text x="36" y="52" fill="#E9E5DC" font-family="'Saira','Saira Condensed',system-ui,sans-serif" font-size="26" font-weight="700" letter-spacing="-0.01em">What the compressor actually does</text>
<text x="36" y="78" fill="#97A1AD" font-family="'Saira','Saira Condensed',system-ui,sans-serif" font-size="14">It does not make cold. It raises pressure so the refrigerant can reject heat at outdoor temperature.</text>
