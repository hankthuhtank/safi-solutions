<text x="36" y="506" fill="#97A1AD" font-family="'Saira','Saira Condensed',system-ui,sans-serif" font-size="13" text-anchor="start">Compare suction and discharge pressure against the P–T chart for the refrigerant on the nameplate, not a remembered number.</text>
