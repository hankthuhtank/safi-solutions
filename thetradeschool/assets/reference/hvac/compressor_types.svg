<text x="276" y="168" fill="#97A1AD" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="9" font-weight="500" text-anchor="start" letter-spacing="0.06em">DISCHARGE</text>
<path d="M100 190 L146 190" stroke="#79A8FF" stroke-width="3" marker-end="url(#ar1)"/>
<path d="M274 190 L336 190" stroke="#E0607E" stroke-width="3" marker-end="url(#ar2)"/>
<text x="64" y="214" fill="#79A8FF" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="11" font-weight="500" text-anchor="start" letter-spacing="0.06em">LOW P IN</text>
<text x="344" y="214" fill="#E0607E" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="11" font-weight="500" text-anchor="start" letter-spacing="0.06em">HIGH P OUT</text>
<text x="64" y="386" fill="#E9E5DC" font-family="'Saira','Saira Condensed',system-ui,sans-serif" font-size="13" text-anchor="start">Piston sweeps a fixed volume. Head valves make flow one-way.</text>
<text x="64" y="406" fill="#97A1AD" font-family="'Saira','Saira Condensed',system-ui,sans-serif" font-size="13" text-anchor="start">Worn valves show up as low capacity, not as a dead unit.</text>
