<line x1="36" y1="474" x2="964" y2="474" stroke="#2E3540"/>
<text x="36" y="504" fill="#E9E5DC" font-family="'Saira','Saira Condensed',system-ui,sans-serif" font-size="14" text-anchor="start">Header size follows span and the load above it. A jack that is short or missing is a load path with a gap in it.</text>
<text x="36" y="528" fill="#97A1AD" font-family="'Saira','Saira Condensed',system-ui,sans-serif" font-size="13" text-anchor="start">Rough opening is sized from the manufacturer's unit dimensions plus shim space, not from the finished door or window.</text>
