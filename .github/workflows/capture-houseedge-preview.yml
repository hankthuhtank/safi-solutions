name: Capture actual HouseEdge preview

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  capture:
    if: github.head_ref == 'fix-houseedge-preview-actual'
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Capture the actual live HouseEdge homepage
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --hide-scrollbars \
            --force-device-scale-factor=1 \
            --window-size=1365,936 \
            --virtual-time-budget=8000 \
            --screenshot=/tmp/houseedge-live.png \
            https://www.safisolutions.org/houseedge/
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          src = Image.open('/tmp/houseedge-live.png').convert('RGB')
          if src.size != (1365, 936):
              src = src.resize((1365, 936), Image.Resampling.LANCZOS)
          src.save('assets/showcase/houseedge-live.webp', 'WEBP', quality=84, method=6)
          print('HouseEdge preview:', src.size)
          PY

      - name: Point the portfolio at the real capture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('assets/projects.js')
          text = path.read_text()
          old = 'houseedge-live.svg?v=hero-v4'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'Expected 2 HouseEdge preview references, found {count}')
          path.write_text(text.replace(old, 'houseedge-live.webp?v=actual-v1'))
          PY
          rm -f assets/showcase/houseedge-live.svg

      - name: Commit the captured preview and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/capture-houseedge-preview.yml
          git add assets/projects.js assets/showcase/houseedge-live.webp assets/showcase/houseedge-live.svg || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Use actual HouseEdge site snapshot"
          git push origin HEAD:${{ github.head_ref }}
