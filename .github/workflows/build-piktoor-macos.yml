name: Build Piktoor macOS
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Download current Piktoor
        shell: bash
        run: |
          set -euo pipefail
          JSON="$(curl -fsSL 'https://safisolutions-downloads.safisolutions.workers.dev/api/free-download?product=piktoor')"
          URL="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["url"])' <<<"$JSON")"
          curl -fL "$URL" -o Piktoor.exe
          shasum -a 256 Piktoor.exe
      - name: Extract embedded application
        shell: bash
        run: |
          python3 - <<'PY'
          import struct, pathlib, zipfile
          p=pathlib.Path('Piktoor.exe').read_bytes()
          e=p.rfind(b'PK\x05\x06')
          if e < 0: raise SystemExit('No embedded ZIP found')
          sig,disk,cd_disk,n_disk,n_total,cd_size,cd_off,comment_len=struct.unpack_from('<4s4H2LH',p,e)
          start=e-cd_size-cd_off
          z=pathlib.Path('payload.zip')
          z.write_bytes(p[start:e+22+comment_len])
          with zipfile.ZipFile(z) as f: f.extractall('payload')
          print('Embedded files:', len(list(pathlib.Path('payload').rglob('*'))))
          PY
      - name: Apply macOS compatibility patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          f=Path('payload/resources/app/main.cjs')
          s=f.read_text()
          s=s.replace("const { app, BrowserWindow, dialog, ipcMain, clipboard, ClipboardItem, nativeImage, shell } = require('electron');",
                      "const { app, BrowserWindow, dialog, ipcMain, clipboard, nativeImage, shell } = require('electron');")
          s=s.replace("  const iconPath = path.join(__dirname, 'Piktoor.ico');",
                      "  const iconPath = path.join(__dirname, process.platform === 'darwin' ? 'Piktoor.png' : 'Piktoor.ico');")
          start=s.index("ipcMain.handle('piktoor:clipboardWriteImage'")
          end=s.index("ipcMain.handle('piktoor:fonts'")
          clip="""ipcMain.handle('piktoor:clipboardWriteImage', async (_event, value = {}) => {
  const image = nativeImage.createFromDataURL(String(value.dataUrl || ''));
  if (image.isEmpty()) throw new Error('Piktoor could not place that image on the system clipboard.');
  clipboard.writeImage(image);
  clipboard.writeBuffer(CUSTOM_CLIPBOARD, Buffer.from(String(value.token || ''), 'utf8'));
  return true;
});
ipcMain.handle('piktoor:clipboardMarkInternal', async (_event, token) => {
  clipboard.writeBuffer(CUSTOM_CLIPBOARD, Buffer.from(String(token || ''), 'utf8'));
  return true;
});
ipcMain.handle('piktoor:clipboardRead', async () => {
  const formats = clipboard.availableFormats();
  let token = null, dataUrl = null;
  try {
    const b = clipboard.readBuffer(CUSTOM_CLIPBOARD);
    if (b && b.length) token = b.toString('utf8');
  } catch {}
  try {
    const image = clipboard.readImage();
    if (image && !image.isEmpty()) dataUrl = image.toDataURL();
  } catch {}
  return { token, dataUrl, formats };
});

"""
          s=s[:start]+clip+s[end:]
          s=s.replace("app.whenReady().then(createWindow);\napp.on('window-all-closed', () => app.quit());",
"""app.on('open-file', (event, file) => {
  event.preventDefault();
  if (file && isSupported(file)) sendOpen(file);
});
app.whenReady().then(createWindow);
app.on('activate', () => {
  if (BrowserWindow.getAllWindows().length === 0) createWindow();
});
app.on('window-all-closed', () => {
  if (process.platform !== 'darwin') app.quit();
});""")
          f.write_text(s)
          ui=Path('payload/resources/app/web/src/main.js')
          ui.write_text(ui.read_text().replace('Windows clipboard','system clipboard'))
          PY
      - name: Build Apple Silicon app
        shell: bash
        run: |
          set -euo pipefail
          VER="$(cat payload/version)"
          curl -fL "https://github.com/electron/electron/releases/download/v${VER}/electron-v${VER}-darwin-arm64.zip" -o electron.zip
          unzip -q electron.zip -d electron
          mv electron/Electron.app "Piktoor.app"
          mv "Piktoor.app/Contents/MacOS/Electron" "Piktoor.app/Contents/MacOS/Piktoor"
          rm -rf "Piktoor.app/Contents/Resources/default_app.asar"
          mkdir -p "Piktoor.app/Contents/Resources/app"
          cp -R payload/resources/app/. "Piktoor.app/Contents/Resources/app/"
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable Piktoor" "Piktoor.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName Piktoor" "Piktoor.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Piktoor" "Piktoor.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.safisolutions.piktoor" "Piktoor.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.0" "Piktoor.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 1.0.0" "Piktoor.app/Contents/Info.plist"
          chmod +x "Piktoor.app/Contents/MacOS/Piktoor"
          codesign --force --deep --sign - "Piktoor.app"
          ditto -c -k --sequesterRsrc --keepParent "Piktoor.app" "Piktoor 1.0 Mac.zip"
          mkdir dmgroot
          cp -R "Piktoor.app" dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "Piktoor 1.0" -srcfolder dmgroot -ov -format UDZO "Piktoor 1.0 Mac.dmg"
          codesign --verify --deep --strict "Piktoor.app"
          file "Piktoor.app/Contents/MacOS/Piktoor"
      - name: Upload Mac deliverables
        uses: actions/upload-artifact@v4
        with:
          name: Piktoor-1.0-macOS
          path: |
            Piktoor 1.0 Mac.dmg
            Piktoor 1.0 Mac.zip

# retrigger macOS build
