name: Apply SafiSolutions v6 rebuild

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-site-rebuild.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply site rebuild
        shell: bash
        run: |
          set -euo pipefail
          cat .site-rebuild/*.b64 | base64 --decode | gzip -d > /tmp/site.patch
          git apply --check -p2 /tmp/site.patch
          git apply -p2 /tmp/site.patch
          rm -rf .site-rebuild
          rm -f site-rebuild-v6.patch.gz.b64
          rm -f .github/workflows/apply-site-rebuild.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish SafiSolutions site rebuild v6"
          git push
