<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Not found — Safi Solutions</title>
    <script>
      (function () {
        var path = location.pathname || "";
        if (path === "/thewell" || path.indexOf("/thewell/") === 0) {
          try {
            sessionStorage.setItem("thewell:path", path + location.search + location.hash);
          } catch (e) {}
          document.documentElement.style.visibility = "hidden";
          location.replace("/thewell/");
        }
      })();
    </script>
    <style>
      html,
      body {
        background: #0b1017;
        color: #e8eef2;
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 32rem;
        margin: 20vh auto;
        padding: 0 1.5rem;
      }
      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <p>That page isn’t here.</p>
      <p><a href="/">Back to Safi Solutions</a></p>
    </main>
  </body>
</html>
