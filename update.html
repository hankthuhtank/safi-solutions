<!DOCTYPE html>
<html lang="en"
  ><head
    ><meta charset="utf-8" /><meta
      name="viewport"
      content="width=device-width,initial-scale=1"
    /><meta name="robots" content="noindex,nofollow" /><title
      >Product updates | Safi Solutions</title
    ><style>
      :root {
        color-scheme: dark;
        --bg: #0b1017;
        --panel: #101720;
        --line: #314139;
        --text: #eef3ef;
        --muted: #a9b7b0;
        --accent: #e8b247;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, sans-serif;
        padding: 24px;
      }
      .shell {
        width: min(760px, 100%);
        margin: 40px auto;
      }
      .top {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        align-items: center;
        margin-bottom: 34px;
      }
      .top img {
        height: 42px;
      }
      .top a {
        color: #c9d5cf;
        text-decoration: none;
        font-size: 12px;
      }
      .card {
        padding: 34px;
        border: 1px solid var(--line);
        background: var(--panel);
        box-shadow: 0 24px 70px #0007;
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #9eb2a9;
        margin-bottom: 12px;
      }
      h1 {
        font-size: clamp(36px, 7vw, 58px);
        line-height: 0.98;
        letter-spacing: -0.04em;
        margin: 0 0 14px;
      }
      p {
        color: #bdc8c2;
        line-height: 1.65;
        margin: 0 0 18px;
      }
      form {
        display: grid;
        gap: 15px;
        margin-top: 24px;
      }
      label {
        display: grid;
        gap: 7px;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #aebbb5;
      }
      input {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #3a4a43;
        background: #0c131a;
        color: #fff;
        font: inherit;
      }
      button,
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        padding: 0 18px;
        border: 0;
        background: var(--accent);
        color: #11161d;
        font-weight: 750;
        text-decoration: none;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      .note {
        font-size: 12px;
        color: #83938b;
      }
      .status {
        margin-top: 20px;
        padding: 14px 15px;
        border: 1px solid #40564b;
        background: #0d1715;
        color: #dce6e1;
      }
      .status.error {
        border-color: #6f4646;
        background: #1d1212;
        color: #ffd6d6;
      }
      .downloads {
        display: grid;
        gap: 10px;
        margin-top: 16px;
      }
      .download {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        padding: 14px;
        border: 1px solid #33423b;
        background: #0e161c;
      }
      .download span {
        display: grid;
        gap: 3px;
      }
      .download small {
        color: #91a097;
      }
      .lost {
        margin-top: 22px;
        padding-top: 18px;
        border-top: 1px solid #2c3831;
        font-size: 13px;
      }
      .lost a {
        color: #d7e1dc;
      }
      .install-notice {
        width: min(500px, calc(100vw - 28px));
        padding: 0;
        border: 1px solid #56616b;
        background: var(--panel);
        color: var(--text);
      }
      .install-notice::backdrop {
        background: #050709cc;
      }
      .install-notice-card {
        padding: 24px;
      }
      .install-notice h2 {
        font-size: 24px;
        margin: 0 0 10px;
        letter-spacing: 0;
      }
      .install-notice p {
        margin: 0;
      }
      .install-actions {
        display: flex;
        justify-content: flex-end;
        gap: 9px;
        margin-top: 20px;
      }
      .install-actions .secondary {
        background: transparent;
        color: var(--text);
        border: 1px solid #56616b;
      }
      @media (max-width: 580px) {
        body {
          padding: 14px;
        }
        .shell {
          margin: 18px auto;
        }
        .card {
          padding: 24px;
        }
        .top {
          align-items: flex-start;
          flex-direction: column;
        }
        .download {
          align-items: flex-start;
          flex-direction: column;
        }
        .download .button {
          width: 100%;
        }
      }
    </style></head
  ><body
    ><main class="shell"
      ><div class="eyebrow">Safi Solutions / Free desktop software</div><h1>Product updates.</h1
      ><p
        >All nine desktop apps are free. Get the current version from its product page. No purchase
        reference or account is required.</p
      ><a class="button" href="/products/">Browse free products ↗</a
      ><p class="small">Need help? <a href="/support.html">Contact support</a>.</p></main
    ><script src="/assets/ambient-particles.js?v=7" defer></script></body
></html>
